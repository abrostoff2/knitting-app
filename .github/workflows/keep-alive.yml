name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes to keep Render backend warm
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/keep-alive.yml

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend to prevent cold start
        run: |
          curl -s https://knitting-app-api.onrender.com/api/yarns/search?query=test || echo "Ping failed, but that's okay"
